<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px 0;
            border-radius: 8px;
        }

        main {
            margin: 20px auto;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-block;
            background-color: #008CBA;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: #005f73;
        }
    </style>
</head>
<body>
    <header>
        <h1>¡Hola, bienvenido a mi sitio web!</h1>
    </header>

    <main>
        <p>Este es un proyecto creado con HTML y CSS listo para publicar en GitHub Pages.</p>
        <a href="#" class="btn">Mi Proyecto Final</a>
    </main>

    <footer>
        <p>Creado con ❤️ para mi proyecto</p>
    </footer>
</body>
</html>
